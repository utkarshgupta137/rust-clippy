# This file is generated by `cargo bless --test config-metadata`.
# Please use that command to update the file and do not edit it by hand.
#
# Template clippy.toml with all configuration options and their default values.
# Copy this file to the root of your project and adjust as needed.

# Which crates to allow absolute paths from
# Affects: absolute_paths (restriction)
absolute-paths-allowed-crates = []

# The maximum number of segments a path can have before being linted, anything above this will
# be linted.
# Affects: absolute_paths (restriction)
absolute-paths-max-segments = 2

# Whether to accept a safety comment to be placed above the attributes for the `unsafe` block
# Affects: undocumented_unsafe_blocks (restriction)
accept-comment-above-attributes = true

# Whether to accept a safety comment to be placed above the statement containing the `unsafe` block
# Affects: undocumented_unsafe_blocks (restriction)
accept-comment-above-statement = true

# Don't lint when comparing the result of a modulo operation to zero.
# Affects: modulo_arithmetic (restriction)
allow-comparison-to-zero = true

# Whether `dbg!` should be allowed in test functions or `#[cfg(test)]`
# Affects: dbg_macro (restriction)
allow-dbg-in-tests = false

# Whether an item should be allowed to have the same name as its containing module
# Affects: module_name_repetitions (restriction)
allow-exact-repetitions = true

# Whether `expect` should be allowed in code always evaluated at compile time
# Affects: expect_used (restriction)
allow-expect-in-consts = true

# Whether `expect` should be allowed in test functions or `#[cfg(test)]`
# Affects: expect_used (restriction)
allow-expect-in-tests = false

# Whether `indexing_slicing` should be allowed in test functions or `#[cfg(test)]`
# Affects: indexing_slicing (restriction)
allow-indexing-slicing-in-tests = false

# Whether functions inside `#[cfg(test)]` modules or test functions should be checked.
# Affects: large_stack_frames (nursery)
allow-large-stack-frames-in-tests = true

# Whether to allow mixed uninlined format args, e.g. `format!("{} {}", a, foo.bar)`
# Affects: uninlined_format_args (pedantic)
allow-mixed-uninlined-format-args = true

# Whether to allow `r#""#` when `r""` can be used
# Affects: needless_raw_string_hashes (pedantic)
allow-one-hash-in-raw-strings = false

# Whether `panic` should be allowed in test functions or `#[cfg(test)]`
# Affects: panic (restriction)
allow-panic-in-tests = false

# Whether print macros (ex. `println!`) should be allowed in test functions or `#[cfg(test)]`
# Affects: print_stderr (restriction)
# Affects: print_stdout (restriction)
allow-print-in-tests = false

# Whether to allow module inception if it's not public.
# Affects: module_inception (style)
allow-private-module-inception = false

# List of trait paths to ignore when checking renamed function parameters.
#
# #### Example
#
# ```toml
# allow-renamed-params-for = [ "std::convert::From" ]
# ```
#
# #### Noteworthy
#
# - By default, the following traits are ignored: `From`, `TryFrom`, `FromStr`
# - `".."` can be used as part of the list to indicate that the configured values should be appended to the
# default configuration of Clippy. By default, any configuration will replace the default value.
# Affects: renamed_function_params (restriction)
allow-renamed-params-for = ["core::convert::From", "core::convert::TryFrom", "core::str::FromStr"]

# Whether `unwrap` should be allowed in code always evaluated at compile time
# Affects: unwrap_used (restriction)
allow-unwrap-in-consts = true

# Whether `unwrap` should be allowed in test functions or `#[cfg(test)]`
# Affects: unwrap_used (restriction)
allow-unwrap-in-tests = false

# Whether `useless_vec` should ignore test functions or `#[cfg(test)]`
# Affects: useless_vec (perf)
allow-useless-vec-in-tests = false

# Additional dotfiles (files or directories starting with a dot) to allow
# Affects: path_ends_with_ext (suspicious)
allowed-dotfiles = []

# A list of crate names to allow duplicates of
# Affects: multiple_crate_versions (cargo)
allowed-duplicate-crates = []

# Allowed names below the minimum allowed characters. The value `".."` can be used as part of
# the list to indicate that the configured values should be appended to the default
# configuration of Clippy. By default, any configuration will replace the default value.
# Affects: min_ident_chars (restriction)
allowed-idents-below-min-chars = ["i", "j", "x", "y", "z", "w", "n"]

# List of prefixes to allow when determining whether an item's name ends with the module's name.
# If the rest of an item's name is an allowed prefix (e.g. item `ToFoo` or `to_foo` in module `foo`),
# then don't emit a warning.
#
# #### Example
#
# ```toml
# allowed-prefixes = [ "to", "from" ]
# ```
#
# #### Noteworthy
#
# - By default, the following prefixes are allowed: `to`, `as`, `into`, `from`, `try_into` and `try_from`
# - PascalCase variant is included automatically for each snake_case variant (e.g. if `try_into` is included,
#   `TryInto` will also be included)
# - Use `".."` as part of the list to indicate that the configured values should be appended to the
# default configuration of Clippy. By default, any configuration will replace the default value
# Affects: module_name_repetitions (restriction)
allowed-prefixes = ["to", "as", "into", "from", "try_into", "try_from"]

# The list of unicode scripts allowed to be used in the scope.
# Affects: disallowed_script_idents (restriction)
allowed-scripts = ["Latin"]

# List of path segments allowed to have wildcard imports.
#
# #### Example
#
# ```toml
# allowed-wildcard-imports = [ "utils", "common" ]
# ```
#
# #### Noteworthy
#
# 1. This configuration has no effects if used with `warn_on_all_wildcard_imports = true`.
# 2. Paths with any segment that containing the word 'prelude'
# are already allowed by default.
# Affects: wildcard_imports (pedantic)
allowed-wildcard-imports = []

# Suppress checking of the passed type names in all types of operations.
#
# If a specific operation is desired, consider using `arithmetic_side_effects_allowed_binary` or `arithmetic_side_effects_allowed_unary` instead.
#
# #### Example
#
# ```toml
# arithmetic-side-effects-allowed = ["SomeType", "AnotherType"]
# ```
#
# #### Noteworthy
#
# A type, say `SomeType`, listed in this configuration has the same behavior of
# `["SomeType" , "*"], ["*", "SomeType"]` in `arithmetic_side_effects_allowed_binary`.
# Affects: arithmetic_side_effects (restriction)
arithmetic-side-effects-allowed = []

# Suppress checking of the passed type pair names in binary operations like addition or
# multiplication.
#
# Supports the "*" wildcard to indicate that a certain type won't trigger the lint regardless
# of the involved counterpart. For example, `["SomeType", "*"]` or `["*", "AnotherType"]`.
#
# Pairs are asymmetric, which means that `["SomeType", "AnotherType"]` is not the same as
# `["AnotherType", "SomeType"]`.
#
# #### Example
#
# ```toml
# arithmetic-side-effects-allowed-binary = [["SomeType" , "f32"], ["AnotherType", "*"]]
# ```
# Affects: arithmetic_side_effects (restriction)
arithmetic-side-effects-allowed-binary = []

# Suppress checking of the passed type names in unary operations like "negation" (`-`).
#
# #### Example
#
# ```toml
# arithmetic-side-effects-allowed-unary = ["SomeType", "AnotherType"]
# ```
# Affects: arithmetic_side_effects (restriction)
arithmetic-side-effects-allowed-unary = []

# The maximum allowed size for arrays on the stack
# Affects: large_const_arrays (perf)
# Affects: large_stack_arrays (pedantic)
array-size-threshold = 16384

# Suppress lints whenever the suggested change would cause breakage for other crates.
# Affects lints in groups: complexity, nursery, pedantic, perf, restriction, style
avoid-breaking-exported-api = true

# The list of types which may not be held across an await point.
# Affects: await_holding_invalid_type (suspicious)
await-holding-invalid-types = []

# For internal testing only, ignores the current `publish` settings in the Cargo manifest.
# Affects: cargo_common_metadata (cargo)
cargo-ignore-publish = false

# Whether to check MSRV compatibility in `#[test]` and `#[cfg(test)]` code.
# Affects: incompatible_msrv (suspicious)
check-incompatible-msrv-in-tests = false

# Whether to suggest reordering constructor fields when initializers are present.
#
# Warnings produced by this configuration aren't necessarily fixed by just reordering the fields. Even if the
# suggested code would compile, it can change semantics if the initializer expressions have side effects. The
# following example [from rust-clippy#11846] shows how the suggestion can run into borrow check errors:
#
# ```rust
# struct MyStruct {
#     vector: Vec<u32>,
#     length: usize
# }
# fn main() {
#     let vector = vec![1,2,3];
#     MyStruct { length: vector.len(), vector};
# }
# ```
#
# [from rust-clippy#11846]: https://github.com/rust-lang/rust-clippy/issues/11846#issuecomment-1820747924
# Affects: inconsistent_struct_constructor (pedantic)
check-inconsistent-struct-field-initializers = false

# Whether to also run the listed lints on private items.
# Affects: missing_errors_doc (pedantic)
# Affects: missing_panics_doc (pedantic)
# Affects: missing_safety_doc (style)
# Affects: unnecessary_safety_doc (restriction)
check-private-items = false

# The maximum cognitive complexity a function can have
# Affects: cognitive_complexity (restriction)
cognitive-complexity-threshold = 25

# The minimum digits a const float literal must have to supress the `excessive_precicion` lint
# Affects: excessive_precision (style)
const-literal-digits-threshold = 30

# The list of disallowed macros, written as fully qualified paths.
#
# **Fields:**
# - `path` (required): the fully qualified path to the macro that should be disallowed
# - `reason` (optional): explanation why this macro is disallowed
# - `replacement` (optional): suggested alternative macro
# - `allow-invalid` (optional, `false` by default): when set to `true`, it will ignore this entry
#   if the path doesn't exist, instead of emitting an error
# Affects: disallowed_macros (style)
disallowed-macros = []

# The list of disallowed methods, written as fully qualified paths.
#
# **Fields:**
# - `path` (required): the fully qualified path to the method that should be disallowed
# - `reason` (optional): explanation why this method is disallowed
# - `replacement` (optional): suggested alternative method
# - `allow-invalid` (optional, `false` by default): when set to `true`, it will ignore this entry
#   if the path doesn't exist, instead of emitting an error
# Affects: disallowed_methods (style)
disallowed-methods = []

# The list of disallowed names to lint about. NB: `bar` is not here since it has legitimate uses. The value
# `".."` can be used as part of the list to indicate that the configured values should be appended to the
# default configuration of Clippy. By default, any configuration will replace the default value.
# Affects: disallowed_names (style)
disallowed-names = ["foo", "baz", "quux"]

# The list of disallowed types, written as fully qualified paths.
#
# **Fields:**
# - `path` (required): the fully qualified path to the type that should be disallowed
# - `reason` (optional): explanation why this type is disallowed
# - `replacement` (optional): suggested alternative type
# - `allow-invalid` (optional, `false` by default): when set to `true`, it will ignore this entry
#   if the path doesn't exist, instead of emitting an error
# Affects: disallowed_types (style)
disallowed-types = []

# The list of words this lint should not consider as identifiers needing ticks. The value
# `".."` can be used as part of the list to indicate that the configured values should be appended to the
# default configuration of Clippy. By default, any configuration will replace the default value. For example:
# * `doc-valid-idents = ["ClipPy"]` would replace the default list with `["ClipPy"]`.
# * `doc-valid-idents = ["ClipPy", ".."]` would append `ClipPy` to the default list.
# Affects: doc_markdown (pedantic)
doc-valid-idents = ["KiB", "MiB", "GiB", "TiB", "PiB", "EiB", "MHz", "GHz", "THz", "AccessKit", "CoAP", "CoreFoundation", "CoreGraphics", "CoreText", "DevOps", "Direct2D", "Direct3D", "DirectWrite", "DirectX", "ECMAScript", "GPLv2", "GPLv3", "GitHub", "GitLab", "IPv4", "IPv6", "InfiniBand", "RoCE", "ClojureScript", "CoffeeScript", "JavaScript", "PostScript", "PureScript", "TypeScript", "PowerPC", "PowerShell", "WebAssembly", "NaN", "NaNs", "OAuth", "GraphQL", "OCaml", "OpenAL", "OpenDNS", "OpenGL", "OpenMP", "OpenSSH", "OpenSSL", "OpenStreetMap", "OpenTelemetry", "OpenType", "WebGL", "WebGL2", "WebGPU", "WebRTC", "WebSocket", "WebTransport", "WebP", "OpenExr", "YCbCr", "sRGB", "TensorFlow", "TrueType", "iOS", "macOS", "FreeBSD", "NetBSD", "OpenBSD", "NixOS", "TeX", "LaTeX", "BibTeX", "BibLaTeX", "MinGW", "CamelCase"]

# Whether to apply the raw pointer heuristic to determine if a type is `Send`.
# Affects: non_send_fields_in_send_ty (nursery)
enable-raw-pointer-heuristic-for-send = true

# Whether to recommend using implicit into iter for reborrowed values.
#
# #### Example
# ```no_run
# let mut vec = vec![1, 2, 3];
# let rmvec = &mut vec;
# for _ in rmvec.iter() {}
# for _ in rmvec.iter_mut() {}
# ```
#
# Use instead:
# ```no_run
# let mut vec = vec![1, 2, 3];
# let rmvec = &mut vec;
# for _ in &*rmvec {}
# for _ in &mut *rmvec {}
# ```
# Affects: explicit_iter_loop (pedantic)
enforce-iter-loop-reborrow = false

# The list of imports to always rename, a fully qualified path followed by the rename.
# Affects: missing_enforced_import_renames (style)
enforced-import-renames = []

# The minimum number of enum variants for the lints about variant names to trigger
# Affects: enum_variant_names (style)
enum-variant-name-threshold = 3

# The maximum size of an enum's variant to avoid box suggestion
# Affects: large_enum_variant (perf)
enum-variant-size-threshold = 200

# The maximum amount of nesting a block can reside in
# Affects: excessive_nesting (complexity)
excessive-nesting-threshold = 0

# The maximum byte size a `Future` can have, before it triggers the `clippy::large_futures` lint
# Affects: large_futures (pedantic)
future-size-threshold = 16384

# A list of paths to types that should be treated as if they do not contain interior mutability
# Affects: borrow_interior_mutable_const (style)
# Affects: declare_interior_mutable_const (suspicious)
# Affects: ifs_same_cond (correctness)
# Affects: mutable_key_type (suspicious)
ignore-interior-mutability = ["bytes::Bytes"]

# Sets the scope ("crate", "file", or "module") in which duplicate inherent `impl` blocks for the same type are linted.
# Affects: multiple_inherent_impl (restriction)
inherent-impl-lint-scope = "crate"

# A list of paths to types that should be ignored as overly large `Err`-variants in a
# `Result` returned from a function
# Affects: result_large_err (perf)
large-error-ignored = []

# The maximum size of the `Err`-variant in a `Result` returned from a function
# Affects: result_large_err (perf)
large-error-threshold = 128

# Whether collapsible `if` and `else if` chains are linted if they contain comments inside the parts
# that would be collapsed.
# Affects: collapsible_else_if (pedantic)
# Affects: collapsible_if (style)
lint-commented-code = false

# The lower bound for linting decimal literals
# Affects: decimal_literal_representation (restriction)
literal-representation-threshold = 16384

# Whether the matches should be considered by the lint, and whether there should
# be filtering for common types.
# Affects: manual_let_else (pedantic)
matches-for-let-else = "WellKnownTypes"

# The maximum number of bool parameters a function can have
# Affects: fn_params_excessive_bools (pedantic)
max-fn-params-bools = 3

# The maximum size of a file included via `include_bytes!()` or `include_str!()`, in bytes
# Affects: large_include_file (restriction)
max-include-file-size = 1000000

# The maximum number of bool fields a struct can have
# Affects: struct_excessive_bools (pedantic)
max-struct-bools = 3

# When Clippy suggests using a slice pattern, this is the maximum number of elements allowed in
# the slice pattern that is suggested. If more elements are necessary, the lint is suppressed.
# For example, `[_, _, _, e, ..]` is a slice pattern with 4 elements.
# Affects: index_refutable_slice (pedantic)
max-suggested-slice-pattern-length = 3

# The maximum number of bounds a trait can have to be linted
# Affects: type_repetition_in_bounds (nursery)
max-trait-bounds = 3

# Minimum chars an ident can have, anything below or equal to this will be linted.
# Affects: min_ident_chars (restriction)
min-ident-chars-threshold = 1

# Whether to allow fields starting with an underscore to skip documentation requirements
# Affects: missing_docs_in_private_items (restriction)
missing-docs-allow-unused = false

# Whether to **only** check for missing documentation in items visible within the current
# crate. For example, `pub(crate)` items.
# Affects: missing_docs_in_private_items (restriction)
missing-docs-in-crate-items = false

# The named groupings of different source item kinds within modules.
# Affects: arbitrary_source_item_ordering (restriction)
module-item-order-groupings = [["modules", ["extern_crate", "mod", "foreign_mod"]], ["use", ["use"]], ["macros", ["macro"]], ["global_asm", ["global_asm"]], ["UPPER_SNAKE_CASE", ["static", "const"]], ["PascalCase", ["ty_alias", "enum", "struct", "union", "trait", "trait_alias", "impl"]], ["lower_snake_case", ["fn"]]]

# Whether the items within module groups should be ordered alphabetically or not.
#
# This option can be configured to "all", "none", or a list of specific grouping names that should be checked
# (e.g. only "enums").
# Affects: arbitrary_source_item_ordering (restriction)
module-items-ordered-within-groupings = "none"

# The minimum rust version that the project supports. Defaults to the `rust-version` field in `Cargo.toml`
# Affects lints in groups: complexity, correctness, nursery, pedantic, perf, restriction, style, suspicious
# msrv = <current version>

# The minimum size (in bytes) to consider a type for passing by reference instead of by value.
# Affects: large_types_passed_by_value (pedantic)
pass-by-value-size-limit = 256

# Lint "public" fields in a struct that are prefixed with an underscore based on their
# exported visibility, or whether they are marked as "pub".
# Affects: pub_underscore_fields (pedantic)
pub-underscore-fields-behavior = "PubliclyExported"

# Whether the type itself in a struct or enum should be replaced with `Self` when encountering recursive types.
# Affects: use_self (nursery)
recursive-self-in-type-definitions = true

# Whether to lint only if it's multiline.
# Affects: semicolon_inside_block (restriction)
semicolon-inside-block-ignore-singleline = false

# Whether to lint only if it's singleline.
# Affects: semicolon_outside_block (restriction)
semicolon-outside-block-ignore-multiline = false

# The maximum number of single char bindings a scope may have
# Affects: many_single_char_names (pedantic)
single-char-binding-names-threshold = 4

# Which kind of elements should be ordered internally, possible values being `enum`, `impl`, `module`, `struct`, `trait`.
# Affects: arbitrary_source_item_ordering (restriction)
source-item-ordering = ["enum", "impl", "module", "struct", "trait"]

# The maximum allowed stack size for functions in bytes
# Affects: large_stack_frames (nursery)
stack-size-threshold = 512000

# Enforce the named macros always use the braces specified.
#
# A `MacroMatcher` can be added like so `{ name = "macro_name", brace = "(" }`. If the macro
# could be used with a full path two `MacroMatcher`s have to be added one with the full path
# `crate_name::macro_name` and one with just the macro name.
# Affects: nonstandard_macro_braces (nursery)
standard-macro-braces = []

# The minimum number of struct fields for the lints about field names to trigger
# Affects: struct_field_names (pedantic)
struct-field-name-threshold = 3

# Whether to suppress a restriction lint in constant code. In same
# cases the restructured operation might not be unavoidable, as the
# suggested counterparts are unavailable in constant code. This
# configuration will cause restriction lints to trigger even
# if no suggestion can be made.
# Affects: indexing_slicing (restriction)
suppress-restriction-lint-in-const = false

# The maximum size of objects (in bytes) that will be linted. Larger objects are ok on the heap
# Affects: boxed_local (perf)
# Affects: useless_vec (perf)
too-large-for-stack = 200

# The maximum number of argument a function or method can have
# Affects: too_many_arguments (complexity)
too-many-arguments-threshold = 7

# The maximum number of lines a function or method can have
# Affects: too_many_lines (pedantic)
too-many-lines-threshold = 100

# The order of associated items in traits.
# Affects: arbitrary_source_item_ordering (restriction)
trait-assoc-item-kinds-order = ["const", "type", "fn"]

# The maximum size (in bytes) to consider a `Copy` type for passing by value instead of by
# reference.
# Affects: trivially_copy_pass_by_ref (pedantic)
# trivial-copy-size-limit = <target_pointer_width>

# The maximum complexity a type can have
# Affects: type_complexity (complexity)
type-complexity-threshold = 250

# The byte size a `T` in `Box<T>` can have, below which it triggers the `clippy::unnecessary_box` lint
# Affects: unnecessary_box_returns (pedantic)
unnecessary-box-size = 128

# Should the fraction of a decimal be linted to include separators.
# Affects: unreadable_literal (pedantic)
unreadable-literal-lint-fractions = true

# Enables verbose mode. Triggers if there is more than one uppercase char next to each other
# Affects: upper_case_acronyms (style)
upper-case-acronyms-aggressive = false

# The size of the boxed type in bytes, where boxing in a `Vec` is allowed
# Affects: vec_box (complexity)
vec-box-size-threshold = 4096

# The maximum allowed size of a bit mask before suggesting to use 'trailing_zeros'
# Affects: verbose_bit_mask (pedantic)
verbose-bit-mask-threshold = 1

# Whether to emit warnings on all wildcard imports, including those from `prelude`, from `super` in tests,
# or for `pub use` reexports.
# Affects: wildcard_imports (pedantic)
warn-on-all-wildcard-imports = false

# Whether to also emit warnings for unsafe blocks with metavariable expansions in **private** macros.
# Affects: macro_metavars_in_unsafe (suspicious)
warn-unsafe-macro-metavars-in-private-macros = false
